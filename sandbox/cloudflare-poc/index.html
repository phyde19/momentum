<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momentum POC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e293b; border-radius: 12px; padding: 2.5rem;
      max-width: 480px; width: 90%; box-shadow: 0 4px 24px rgba(0,0,0,.4);
    }
    h1 { font-size: 1.25rem; color: #94a3b8; margin-bottom: 1.5rem; }
    #message {
      font-size: 1.5rem; font-weight: 600; color: #f8fafc;
      padding: 1rem; background: #0f172a; border-radius: 8px;
      margin-bottom: 1.5rem; min-height: 3.5rem;
    }
    .row { display: flex; gap: .5rem; }
    input {
      flex: 1; padding: .625rem .75rem; border-radius: 6px; border: 1px solid #334155;
      background: #0f172a; color: #f8fafc; font-size: .95rem; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      padding: .625rem 1.25rem; border-radius: 6px; border: none;
      background: #3b82f6; color: #fff; font-weight: 600;
      cursor: pointer; font-size: .95rem; white-space: nowrap;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 1rem; font-size: .85rem; min-height: 1.25rem;
    }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Momentum &mdash; Cloudflare POC</h1>
    <div id="message">loading&hellip;</div>
    <div class="row">
      <input id="input" type="text" placeholder="New message&hellip;">
      <button id="btn" onclick="update()">Update</button>
    </div>
    <div id="status" class="status"></div>
  </div>
  <script>
    const msgEl    = document.getElementById("message");
    const inputEl  = document.getElementById("input");
    const btnEl    = document.getElementById("btn");
    const statusEl = document.getElementById("status");

    async function load() {
      try {
        const res = await fetch("/agent/v1/message");
        const data = await res.json();
        msgEl.textContent = data.message;
        statusEl.textContent = "";
      } catch (e) {
        msgEl.textContent = "error";
        statusEl.textContent = e.message;
        statusEl.className = "status err";
      }
    }

    async function update() {
      const text = inputEl.value.trim();
      if (!text) return;
      btnEl.disabled = true;
      try {
        const res = await fetch("/agent/v1/message", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        msgEl.textContent = data.message;
        inputEl.value = "";
        statusEl.textContent = "updated";
        statusEl.className = "status ok";
      } catch (e) {
        statusEl.textContent = e.message;
        statusEl.className = "status err";
      } finally {
        btnEl.disabled = false;
      }
    }

    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") update(); });
    load();
  </script>
</body>
</html>
